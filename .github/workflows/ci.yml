name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "HSL_API_KEY=test_key" > local.properties
          echo "KEYSTORE_FILE=123" >> local.properties
          echo "KEYSTORE_PASSWORD=123" >> local.properties
          echo "KEY_ALIAS=123" >> local.properties
          echo "KEY_PASSWORD=123" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
